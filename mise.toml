[tools]
node = "25"

[tasks.install]
run = "npm install"
description = "Install Node dependencies"

[tasks.dev]
run = "npm run dev"
description = "Start development server"

[tasks.build]
run = "npm run build"
description = "Build for production"

[tasks.preview]
run = "npm run preview"
description = "Preview production build locally"

[tasks.check]
run = "npm run check"
description = "Run Svelte type checker"

[tasks."live:login"]
run = "npm run live:login"
description = "Capture a nemlig.com session from a manual local login"

[tasks."live:request"]
run = "npm run live:request --"
description = "Send an authenticated request to the local Nemmest API"

[tasks."db:start"]
run = "docker compose -f docker-compose.dev.yml up -d"
description = "Start development database"

[tasks."db:stop"]
run = "docker compose -f docker-compose.dev.yml down"
description = "Stop development database"

[tasks."db:generate"]
run = "drizzle-kit generate"
description = "Generate a migration from schema changes"

[tasks."db:migrate"]
run = "drizzle-kit migrate"
description = "Apply pending migrations"
